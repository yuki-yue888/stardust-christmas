<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#020817">
<title>Merry Christmas · 星尘圣诞树</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020714;color:#eaf7ff;font-family:Georgia,"Times New Roman","Songti SC",serif}
#universe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#universe:active{cursor:grabbing}
.shade{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 48%,transparent 35%,rgba(0,3,14,.2) 72%,rgba(0,2,10,.58) 100%)}
.greeting{position:fixed;z-index:2;top:10.5%;left:0;right:0;text-align:center;pointer-events:none;color:#e9f7ff;font-size:clamp(17px,2.2vw,29px);font-weight:400;letter-spacing:.19em;text-shadow:0 0 8px #d8f6ff,0 0 22px #91dfff,0 0 40px #5bb9ef;white-space:nowrap}
.greeting span{display:inline-block;transform:scaleX(.96)}
.controls{position:fixed;z-index:5;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:9px;padding:7px 11px;border:1px solid rgba(177,221,255,.13);border-radius:30px;background:rgba(5,16,34,.3);backdrop-filter:blur(8px);opacity:.78;transition:opacity .25s,border-color .25s}
.controls:hover{opacity:1;border-color:rgba(177,221,255,.34)}
.control{width:32px;height:32px;border:1px solid rgba(194,230,255,.32);border-radius:50%;display:grid;place-items:center;background:rgba(113,166,210,.12);color:#e5f7ff;font:14px/1 -apple-system,BlinkMacSystemFont,sans-serif;cursor:pointer;box-shadow:0 0 13px rgba(137,210,255,.09);transition:.2s}
.control:hover,.control.active{background:rgba(157,218,255,.28);box-shadow:0 0 18px rgba(137,210,255,.3);border-color:rgba(220,246,255,.72)}
.control:disabled{opacity:.45;cursor:wait}
.separator{height:19px;width:1px;background:rgba(185,222,255,.2);margin:0 1px}
.status{position:fixed;z-index:4;bottom:max(72px,calc(env(safe-area-inset-bottom) + 68px));left:0;right:0;text-align:center;color:rgba(196,224,246,.62);font:10px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.12em;pointer-events:none;opacity:0;transition:opacity .3s}
.status.show{opacity:1}
.camera-box{position:fixed;z-index:6;right:16px;bottom:16px;width:126px;display:none;overflow:hidden;border:1px solid rgba(180,224,255,.3);border-radius:12px;background:#061326;box-shadow:0 8px 26px #0008}
.camera-box.show{display:block}
.camera-box video{display:block;width:100%;transform:scaleX(-1)}
.camera-caption{padding:6px 8px;color:#c5e5fa;font:9px -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:.08em}
.music-link{position:fixed;right:22px;top:22px;z-index:5;color:rgba(195,222,244,.62);font:10px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;letter-spacing:.08em;text-decoration:none;transition:.2s}
.music-link:hover{color:#effaff;text-shadow:0 0 12px #a8e7ff}
.toast{position:fixed;z-index:8;top:20px;left:50%;transform:translateX(-50%);padding:9px 14px;border:1px solid rgba(180,224,255,.2);border-radius:20px;background:rgba(3,13,29,.88);color:#e7f6ff;font:11px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;opacity:0;pointer-events:none;transition:opacity .25s}
.toast.show{opacity:1}
@media(max-width:600px){.greeting{top:9%;font-size:17px}.music-link{top:17px;right:14px;font-size:9px}.controls{bottom:max(18px,env(safe-area-inset-bottom));gap:7px}.control{width:30px;height:30px}.status{bottom:max(62px,calc(env(safe-area-inset-bottom) + 58px))}.camera-box{width:98px;right:8px;bottom:8px}}
@media(prefers-reduced-motion:reduce){.controls,.status{transition:none}}
</style>
</head>
<body>
<canvas id="universe" aria-label="银白色星尘粒子圣诞树与环绕星环"></canvas>
<div class="shade"></div>
<div class="greeting"><span>MERRY CHRISTMAS</span></div>
<a class="music-link" href="https://163cn.tv/blhNxDl5" target="_blank" rel="noopener noreferrer">♫ TINY7 · 浆果</a>
<div class="toast" id="toast"></div>
<div class="camera-box" id="cameraBox"><video id="camera" autoplay playsinline muted></video><div class="camera-caption" id="cameraCaption">HAND TRACKING</div></div>
<div class="status" id="status" aria-live="polite">张开手掌：星尘散开　·　拇指食指捏合：聚合　·　左右移动：旋转</div>
<div class="controls" aria-label="圣诞树控制">
  <button class="control" id="handButton" title="开启手势控制" aria-label="开启手势控制">✋</button>
  <button class="control" id="scatterButton" title="星尘散开" aria-label="星尘散开">✧</button>
  <button class="control" id="gatherButton" title="聚合成树" aria-label="聚合成树">✦</button>
  <span class="separator"></span>
  <button class="control" id="musicButton" title="在网易云音乐听浆果" aria-label="在网易云音乐听浆果">♫</button>
</div>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('universe');
const ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id);
const video=$('camera');
let W=0,H=0,DPR=1,tree=[],orbits=[],dust=[],stars=[],snow=[],nebula=[];
let rotation=0,targetRotation=0,spread=0,targetSpread=0,dragging=false,lastX=0;
let handLandmarker=null,cameraStream=null,tracking=false,lastVideoTime=-1,frameHandle=0;
const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function toast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.classList.remove('show'),2800)}
function setStatus(message,visible=true){$('status').textContent=message;$('status').classList.toggle('show',visible)}
function resize(){
  W=innerWidth;H=innerHeight;DPR=Math.min(2,Math.max(1,window.devicePixelRatio||1));
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);
  makeAtmosphere();makeTree();makeOrbit();
}
function makeAtmosphere(){
  // Build an uneven, layered star field rather than a uniform sprinkle of identical dots.
  const count=Math.round(clamp(W*H/2100,480,1250));
  const clusters=Array.from({length:9},()=>({
    x:rand(W*.04,W*.96),y:rand(H*.12,H*.9),
    sx:rand(W*.025,W*.075),sy:rand(H*.025,H*.085)
  }));
  stars=[];
  for(let i=0;i<count;i++){
    const mode=Math.random();
    let x,y;
    if(mode<.34){
      const c=clusters[Math.floor(Math.random()*clusters.length)];
      const gx=Math.sqrt(-2*Math.log(Math.max(.00001,Math.random())))*Math.cos(rand(0,Math.PI*2));
      const gy=Math.sqrt(-2*Math.log(Math.max(.00001,Math.random())))*Math.sin(rand(0,Math.PI*2));
      x=c.x+gx*c.sx;y=c.y+gy*c.sy;
    }else if(mode<.59){
      // A very faint diagonal dust lane gives the sky depth without looking like a graphic stripe.
      x=rand(0,W);
      const lane=H*(.2+.48*x/W);
      y=lane+rand(-1,1)*H*.19;
    }else{x=rand(0,W);y=rand(0,H);}
    x=clamp(x,0,W);y=clamp(y,0,H);
    const layer=Math.random();
    const radius=layer<.72?rand(.22,.58):layer<.96?rand(.48,.88):rand(.78,1.12);
    const alpha=layer<.72?rand(.10,.31):layer<.96?rand(.16,.42):rand(.27,.58);
    stars.push({
      x,y,r:radius,a:alpha,
      phase:rand(0,Math.PI*2),speed:rand(.18,.72),
      twinkle:Math.random()<.16,twinkleAmount:rand(.06,.19),
      tone:Math.random()<.08?'warm':Math.random()<.22?'blue':'ice',
      glint:Math.random()<.012
    });
  }
  // Diffuse, almost imperceptible nebula patches; no hard-edged clouds or bright blobs.
  nebula=Array.from({length:5},()=>({
    x:rand(W*.08,W*.92),y:rand(H*.16,H*.86),
    radius:rand(Math.min(W,H)*.12,Math.min(W,H)*.3),
    alpha:rand(.018,.045),hue:rand(205,222)
  }));
  // A few tiny drifting motes add depth; they should not read as large falling snowflakes.
  snow=Array.from({length:Math.round(clamp(W/42,16,42))},()=>({
    x:rand(0,W),y:rand(0,H),r:rand(.2,.62),
    dx:rand(-.025,.025),dy:rand(-.045,.035),a:rand(.045,.14)
  }));
}
function makeTree(){
  tree=[];
  const count=Math.round(clamp(W*H/118,6200,11200));
  for(let i=0;i<count;i++){
    const surface=i%5!==0;
    const h=surface?rand(.035,1):Math.cbrt(Math.random());
    const maxR=.79*Math.pow(h,.92);
    const radial=surface?rand(.78,1.015):Math.sqrt(Math.random())*.94;
    const angle=rand(0,Math.PI*2);
    const r=maxR*radial;
    const y=-1.12+h*2.08;
    tree.push({x:Math.cos(angle)*r,y,z:Math.sin(angle)*r,r,angle,h,
      scatterX:rand(-2.5,2.5),scatterY:rand(-1.6,1.8),scatterZ:rand(-2.5,2.5),
      size:surface?rand(.42,1.2):rand(.34,.95),hue:rand(188,207),alpha:rand(.34,.92),
      phase:rand(0,Math.PI*2),speed:rand(.55,1.7),spark:Math.random()<.075,surface});
  }
  // Bright, delicate spiral strands give the cone a layered, flowing silhouette.
  for(let strand=0;strand<7;strand++){
    const n=260;
    for(let j=0;j<n;j++){
      const h=.04+.94*j/(n-1),angle=j/(n-1)*Math.PI*2*2.2+strand*Math.PI*2/7;
      const r=.79*Math.pow(h,.92)*(1+.012*Math.sin(j*.12+strand));
      tree.push({x:Math.cos(angle)*r,y:-1.12+h*2.08,z:Math.sin(angle)*r,r,angle,h,
        scatterX:rand(-2,2),scatterY:rand(-1.5,1.5),scatterZ:rand(-2,2),
        size:rand(.55,1.05),hue:rand(190,207),alpha:rand(.48,.95),phase:rand(0,7),speed:rand(.8,1.5),spark:Math.random()<.12,surface:true});
    }
  }
}
function makeOrbit(){
  orbits=[];dust=[];
  const ringDefs=[
    {rx:.48,ry:.105,n:1450,phase:.0},
    {rx:.61,ry:.14,n:1650,phase:1.3},
    {rx:.76,ry:.19,n:1850,phase:2.2},
    {rx:.9,ry:.225,n:1750,phase:3.5}
  ];
  for(let k=0;k<ringDefs.length;k++){
    const def=ringDefs[k];
    for(let i=0;i<def.n;i++){
      const a=rand(0,Math.PI*2),jitter=rand(-.026,.026);
      const wave=Math.sin(a*2+def.phase)*.014+Math.sin(a*5+def.phase)*.006+rand(-.006,.006);
      orbits.push({
        a,r:1+jitter+wave,rx:def.rx,ry:def.ry,phase:def.phase,
        size:rand(.3,1.02),alpha:rand(.12,.46),hue:rand(190,214),
        speed:rand(.000018,.000085),spark:Math.random()<.012,depth:Math.sin(a)
      });
    }
  }
  // Loose spiral wisps; density and brightness taper irregularly at the edges.
  for(let i=0;i<1900;i++){
    const u=i/1900,a=u*Math.PI*2*2.65+rand(-.055,.055),r=.16+.88*u+rand(-.018,.018);
    orbits.push({
      a,r,rx:.54,ry:.125,phase:1.8,size:rand(.28,.86),
      alpha:rand(.09,.34),hue:rand(192,214),speed:rand(.000025,.000075),
      spark:Math.random()<.009,depth:Math.sin(a)
    });
  }
  for(let i=0;i<620;i++){
    const a=rand(0,Math.PI*2);
    orbits.push({
      a,r:rand(.88,1.12),rx:.19,ry:.085,phase:2.8,size:rand(.28,.78),
      alpha:rand(.1,.38),hue:rand(192,213),speed:rand(.00003,.00009),
      spark:Math.random()<.01,depth:Math.sin(a)
    });
  }
  const dustCount=Math.round(clamp(W*H/420,1200,3000));
  for(let i=0;i<dustCount;i++){
    const a=rand(0,Math.PI*2),r=rand(.38,.98);
    dust.push({
      a,r,rx:.9,ry:.225,size:rand(.22,.78),alpha:rand(.035,.17),
      hue:rand(190,213),phase:rand(0,7),speed:rand(.000012,.000052)
    });
  }
}
function project(x,y,z){
  const c=Math.cos(rotation),s=Math.sin(rotation);
  const xr=x*c-z*s,zr=x*s+z*c;
  const depth=4.15+zr;
  const scale=Math.min(W,H)*.82/depth;
  return {x:W*.5+xr*scale,y:H*.475+y*scale,z:zr,scale,depth};
}
function drawBackground(t){
  const g=ctx.createRadialGradient(W*.5,H*.47,0,W*.5,H*.47,Math.max(W,H)*.78);
  g.addColorStop(0,'#101e3c');g.addColorStop(.42,'#09142d');g.addColorStop(1,'#010611');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Soft blue-violet interstellar haze, kept far below the brightness of the tree.
  ctx.save();ctx.globalCompositeOperation='screen';
  for(const n of nebula){
    const cloud=ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.radius);
    cloud.addColorStop(0,`hsla(${n.hue},48%,48%,${n.alpha})`);
    cloud.addColorStop(.42,`hsla(${n.hue},52%,35%,${n.alpha*.42})`);
    cloud.addColorStop(1,`hsla(${n.hue},50%,25%,0)`);
    ctx.fillStyle=cloud;ctx.fillRect(n.x-n.radius,n.y-n.radius,n.radius*2,n.radius*2);
  }
  ctx.restore();

  for(const s of stars){
    const shimmer=s.twinkle
      ? 1-s.twinkleAmount+s.twinkleAmount*(.5+.5*Math.sin(t*.0007*s.speed+s.phase))
      : 1;
    const alpha=s.a*shimmer;
    const color=s.tone==='warm'?'255,239,220':s.tone==='blue'?'173,211,248':'216,235,255';
    if(s.glint){
      const halo=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,4.8);
      halo.addColorStop(0,`rgba(${color},${alpha*.28})`);
      halo.addColorStop(1,`rgba(${color},0)`);
      ctx.fillStyle=halo;ctx.beginPath();ctx.arc(s.x,s.y,4.8,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle=`rgba(${color},${alpha*.3})`;ctx.lineWidth=.42;
      ctx.beginPath();ctx.moveTo(s.x-2.2,s.y);ctx.lineTo(s.x+2.2,s.y);
      ctx.moveTo(s.x,s.y-2.2);ctx.lineTo(s.x,s.y+2.2);ctx.stroke();
    }
    ctx.fillStyle=`rgba(${color},${alpha})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }

  for(const f of snow){
    f.x+=f.dx+Math.sin(t*.00012+f.y*.003)*.008;
    f.y+=f.dy;
    if(f.x<0)f.x=W;if(f.x>W)f.x=0;
    if(f.y<0)f.y=H;if(f.y>H)f.y=0;
    ctx.fillStyle=`rgba(194,220,246,${f.a})`;
    ctx.beginPath();ctx.arc(f.x,f.y,f.r,0,Math.PI*2);ctx.fill();
  }
}
function drawOrbit(t){
  const cx=W*.5,cy=H*.695,base=Math.min(W*.52,H*.92);
  // The broad orbit haze is broken and dim, like scattered galactic dust rather than neon rings.
  ctx.save();ctx.globalCompositeOperation='source-over';
  for(let k=0;k<4;k++){
    const rx=base*(.48+k*.15),ry=base*(.105+k*.038);
    ctx.beginPath();ctx.ellipse(cx,cy,rx,ry,-.025+k*.012,Math.PI*1.02,Math.PI*2.02);
    ctx.strokeStyle=`rgba(137,199,241,${.052-k*.007})`;
    ctx.lineWidth=1.4+k*.45;ctx.shadowColor='#8bcfff';ctx.shadowBlur=9;ctx.stroke();
  }
  ctx.restore();ctx.shadowBlur=0;
  const items=[];
  for(const p of orbits){
    const a=p.a+t*p.speed*(p.depth<0?-1:1)+rotation*.12;
    const rx=base*p.rx,ry=base*p.ry;
    const x=cx+Math.cos(a)*rx*p.r,y=cy+Math.sin(a)*ry*p.r;
    items.push({x,y,z:Math.sin(a),p,tw:Math.sin(t*.00055+p.phase+a*2)});
  }
  for(const p of dust){
    const a=p.a+t*p.speed+rotation*.12;
    const x=cx+Math.cos(a)*base*p.rx*p.r,y=cy+Math.sin(a)*base*p.ry*p.r;
    items.push({x,y,z:Math.sin(a)*.7,p,tw:Math.sin(t*.00038+p.phase)});
  }
  items.sort((a,b)=>a.z-b.z);
  for(const q of items){
    const p=q.p,alpha=p.alpha*(.84+.16*q.tw);
    ctx.fillStyle=`hsla(${p.hue},62%,${p.spark?91:82}%,${alpha})`;
    ctx.beginPath();ctx.arc(q.x,q.y,p.size*(p.spark?1.12:1),0,Math.PI*2);ctx.fill();
    if(p.spark){
      const glow=ctx.createRadialGradient(q.x,q.y,0,q.x,q.y,1.9);
      glow.addColorStop(0,`rgba(218,242,255,${alpha*.22})`);
      glow.addColorStop(1,'rgba(218,242,255,0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(q.x,q.y,1.9,0,Math.PI*2);ctx.fill();
    }
  }
}
function drawTree(t){
  const halo=ctx.createRadialGradient(W*.5,H*.51,Math.min(W,H)*.035,W*.5,H*.51,Math.min(W,H)*.38);halo.addColorStop(0,'rgba(176,229,255,.13)');halo.addColorStop(.34,'rgba(119,194,241,.07)');halo.addColorStop(1,'rgba(58,121,181,0)');ctx.fillStyle=halo;ctx.fillRect(W*.5-Math.min(W,H)*.4,H*.18,Math.min(W,H)*.8,H*.62);
  const items=[];
  for(const p of tree){
    const swirl=t*.000045*p.speed;
    const angle=p.angle+rotation+swirl+Math.sin(t*.0008+p.phase)*.006;
    const wobble=1+Math.sin(t*.0011*p.speed+p.phase)*.009;
    const r=p.r*wobble;
    const x=Math.cos(angle)*r+(p.scatterX-p.x)*spread;
    const y=p.y+(p.scatterY-p.y)*spread;
    const z=Math.sin(angle)*r+(p.scatterZ-p.z)*spread;
    const q=project(x,y,z);
    const tw=.68+.32*Math.sin(t*.0013*p.speed+p.phase);
    items.push({p,q,tw});
  }
  items.sort((a,b)=>b.q.depth-a.q.depth);
  ctx.save();ctx.globalCompositeOperation='source-over';
  for(const o of items){
    const p=o.p,q=o.q;const alpha=p.alpha*o.tw*(p.surface?1:.78);
    const radius=p.size*(.62+q.scale/(Math.min(W,H)*.82)*.45);
    ctx.fillStyle=`hsla(${p.hue},82%,${p.spark?96:86}%,${alpha})`;
    ctx.beginPath();ctx.arc(q.x,q.y,Math.max(.34,radius),0,Math.PI*2);ctx.fill();
    if(p.spark){ctx.fillStyle=`rgba(224,248,255,${alpha*.24})`;ctx.beginPath();ctx.arc(q.x,q.y,radius*2.8,0,Math.PI*2);ctx.fill();}
  }
  ctx.restore();
}
function drawTopStar(t){
  const p=project(0,-1.18,0),x=p.x,y=p.y-2.5;
  const pulse=.94+.06*Math.sin(t*.00115);
  const size=Math.min(W,H);
  ctx.save();
  ctx.globalCompositeOperation='lighter';

  // A quiet, pearly bloom: keep the halo close to the bright center.
  const halo=ctx.createRadialGradient(x,y,0,x,y,size*.031);
  halo.addColorStop(0,'rgba(255,255,255,.42)');
  halo.addColorStop(.12,'rgba(231,249,255,.23)');
  halo.addColorStop(.38,'rgba(177,226,250,.075)');
  halo.addColorStop(1,'rgba(112,190,235,0)');
  ctx.fillStyle=halo;
  ctx.beginPath();
  ctx.arc(x,y,size*.031,0,Math.PI*2);
  ctx.fill();

  // Fine, uneven rays like light catching the tip of a crystal.
  const rays=[
    [-Math.PI/2,1.00],[-Math.PI/2+.48,.38],[-Math.PI/2+.91,.26],
    [-Math.PI/2+1.48,.52],[-Math.PI/2+2.02,.30],[-Math.PI/2+2.58,.42],
    [-Math.PI/2+Math.PI,.82],[-Math.PI/2+Math.PI+.52,.31],
    [-Math.PI/2+Math.PI+.98,.22],[-Math.PI/2+Math.PI+1.52,.46],
    [-Math.PI/2+Math.PI+2.08,.28],[-Math.PI/2+Math.PI+2.62,.36]
  ];
  for(let i=0;i<rays.length;i++){
    const [a,k]=rays[i];
    const length=size*(.012+.025*k)*pulse;
    const inner=size*.002;
    const outerX=x+Math.cos(a)*length;
    const outerY=y+Math.sin(a)*length;
    const grad=ctx.createLinearGradient(x+Math.cos(a)*inner,y+Math.sin(a)*inner,outerX,outerY);
    grad.addColorStop(0,'rgba(255,255,255,.92)');
    grad.addColorStop(.22,'rgba(232,249,255,.66)');
    grad.addColorStop(1,'rgba(190,231,251,0)');
    ctx.strokeStyle=grad;
    ctx.lineWidth=i%3===0?.85:.48;
    ctx.beginPath();
    ctx.moveTo(x+Math.cos(a)*inner,y+Math.sin(a)*inner);
    ctx.lineTo(outerX,outerY);
    ctx.stroke();
  }

  // A few faint glints around the core prevent a rigid, icon-like silhouette.
  for(let i=0;i<7;i++){
    const a=i*2.399+t*.000025;
    const d=size*(.008+(i%3)*.003);
    const px=x+Math.cos(a)*d,py=y+Math.sin(a)*d;
    ctx.fillStyle=`rgba(232,249,255,${.28+.12*Math.sin(t*.001+i)})`;
    ctx.beginPath();
    ctx.arc(px,py,i%2?.55:.8,0,Math.PI*2);
    ctx.fill();
  }

  const core=ctx.createRadialGradient(x,y,0,x,y,size*.0045);
  core.addColorStop(0,'rgba(255,255,255,1)');
  core.addColorStop(.42,'rgba(244,252,255,.94)');
  core.addColorStop(1,'rgba(202,239,255,0)');
  ctx.fillStyle=core;
  ctx.beginPath();
  ctx.arc(x,y,size*.0045,0,Math.PI*2);
  ctx.fill();
  ctx.restore();
}
function render(t){
  spread+=(targetSpread-spread)*.045;rotation+=(targetRotation-rotation)*.035;
  drawBackground(t);drawOrbit(t);drawTree(t);drawTopStar(t);
  frameHandle=requestAnimationFrame(render);
}
function setSpread(value){targetSpread=value;setStatus(value?'星尘正在散向星空':'星尘正在聚合成树',true);}
$('scatterButton').addEventListener('click',()=>setSpread(1));
$('gatherButton').addEventListener('click',()=>setSpread(0));
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-lastX;lastX=e.clientX;targetRotation+=dx*.0045;});
canvas.addEventListener('pointerup',()=>dragging=false);canvas.addEventListener('pointercancel',()=>dragging=false);
function distance(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function onHand(result){
  const lm=result.landmarks&&result.landmarks[0];if(!lm)return;
  const pinch=distance(lm[4],lm[8])<.052;
  const open=[lm[8].y<lm[6].y,lm[12].y<lm[10].y,lm[16].y<lm[14].y,lm[20].y<lm[18].y].filter(Boolean).length>=3;
  targetRotation=(.5-lm[9].x)*2.1;
  if(pinch){targetSpread=0;$('cameraCaption').textContent='捏合 · 星尘聚合';setStatus('捏合手指：星尘聚合成树',true);}
  else if(open){targetSpread=1;$('cameraCaption').textContent='张开手掌 · 星尘散开';setStatus('张开手掌：星尘向外散开',true);}
  else{$('cameraCaption').textContent='左右移动 · 旋转';}
}
async function withTimeout(promise,ms,label){let timer;try{return await Promise.race([promise,new Promise((_,reject)=>timer=setTimeout(()=>reject(new Error(label)),ms))]);}finally{clearTimeout(timer);}}
async function enableHand(){
  const button=$('handButton');button.disabled=true;button.classList.add('active');setStatus('正在连接摄像头与手势识别…',true);
  try{
    if(!navigator.mediaDevices?.getUserMedia)throw new Error('此页面无法访问摄像头，请使用 HTTPS 的 Chrome。');
    cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
    video.srcObject=cameraStream;await video.play();
    const mp=await withTimeout(import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14'),20000,'手势识别组件加载超时');
    const vision=await withTimeout(mp.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'),20000,'手势模型加载超时');
    handLandmarker=await withTimeout(mp.HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1}),25000,'手势模型初始化超时');
    tracking=true;$('cameraBox').classList.add('show');button.textContent='×';button.disabled=false;setStatus('张开手掌：星尘散开　·　拇指食指捏合：聚合　·　左右移动：旋转',true);requestAnimationFrame(trackHands);
  }catch(error){console.error(error);if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;video.srcObject=null;button.disabled=false;button.classList.remove('active');button.textContent='✋';setStatus('手势未启动；可以拖动旋转，或检查摄像头权限后重试',true);toast(error.name==='NotAllowedError'?'请在 Chrome 地址栏允许摄像头权限':error.message||'手势识别启动失败');}
}
function trackHands(){if(!tracking||!handLandmarker)return;if(video.currentTime!==lastVideoTime){lastVideoTime=video.currentTime;const result=handLandmarker.detectForVideo(video,performance.now());if(result.landmarks?.length)onHand(result);}requestAnimationFrame(trackHands);}
function disableHand(){tracking=false;if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cameraStream=null;video.srcObject=null;$('cameraBox').classList.remove('show');const button=$('handButton');button.textContent='✋';button.classList.remove('active');button.disabled=false;targetSpread=0;setStatus('手势已关闭 · 拖动屏幕可旋转星尘圣诞树',true);}
$('handButton').addEventListener('click',()=>tracking?disableHand():enableHand());
$('musicButton').addEventListener('click',()=>window.open('https://163cn.tv/blhNxDl5','_blank','noopener'));
window.addEventListener('resize',resize);
window.addEventListener('beforeunload',()=>{if(cameraStream)cameraStream.getTracks().forEach(track=>track.stop());cancelAnimationFrame(frameHandle);});
resize();requestAnimationFrame(render);
})();
</script>
